id: "/subscriptions/5be60d68-f066-4329-b523-a852dcab22f2/resourceGroups/rg-sentinel/providers/Microsoft.OperationalInsights/workspaces/lw-sentinel/providers/Microsoft.SecurityInsights/alertRules/c0988ea6-e138-4752-ae7f-764e4c701a25"
kind: MLBehaviorAnalytics
