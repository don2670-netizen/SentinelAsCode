name: "2bb167bf-3951-435b-a932-8b03bfde0a2b"
properties:
  anomalySettingsVersion: 0
  anomalyVersion: "3.4.11"
  customizableObservations:
    multiSelectObservations:
      - description: Include only these specific device actions
        name: Device action
        rerun: RerunAlways
        sequenceNumber: 0
        supportedValues:
