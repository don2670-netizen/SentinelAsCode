# Primary (646bb98f-1c07-44fe-a061-0e03f529682d) · Sentinel · lw-SOCtest · Analytics rules
# Bitsadmin Activity
# Eksporteret af SocHub. Historikken for filen (git log) er objektets versionshistorik.
id: "/subscriptions/f6033f31-9abe-488f-822e-41d46f45644e/resourceGroups/rg-soc/providers/Microsoft.OperationalInsights/workspaces/lw-SOCtest/providers/Microsoft.SecurityInsights/alertRules/326f2c07-ee9d-49c8-9b19-389f0b221c17"
kind: Scheduled
name: "326f2c07-ee9d-49c8-9b19-389f0b221c17"
properties:
  alertRuleTemplateName: "2a1dc4c2-a8d6-4a0e-8539-9b971c851195"
  description: |-
    Background Intelligent Transfer Service (BITS) is a way to reliably download files from webservers or SMB servers. 
    This service is commonly used for legitimate purposes, but can also be used as part of a malware downloader. 
    Additionally, bitsadmin can be used to upload files and therefore can be used for data exfiltration. This
    query will identify use of bitsadmin.exe for either purpose and will identify directionality file transfer
    directionality.
  displayName: Bitsadmin Activity
  enabled: true
  entityMappings:
    - entityType: Host
      fieldMappings:
        - columnName: DeviceName
          identifier: FullName
        - columnName: HostName
          identifier: HostName
        - columnName: DnsDomain
          identifier: DnsDomain
    - entityType: Process
      fieldMappings:
        - columnName: ProcessId
          identifier: ProcessId
        - columnName: ProcessCommandLine
          identifier: CommandLine
  eventGroupingSettings:
    aggregationKind: SingleAlert
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: false
      groupByAlertDetails: []
      groupByCustomDetails: []
      groupByEntities: []
      lookbackDuration: PT5H
      matchingMethod: AllEntities
      reopenClosedIncident: false
  query: |
    DeviceProcessEvents
    | where 
        (FileName =~ "bitsadmin.exe" or column_ifexists('ProcessVersionInfoOriginalFileName','ColumnNotAvailable') =~ 'bitsadmin.exe')
        and ProcessCommandLine has_any ('/Transfer','/AddFile', '/AddFileSet','/AddFileWithRanges')
    | extend 
        ParsedCommandLine = parse_command_line(ProcessCommandLine,'windows')
    | extend     
        RemoteUrl = tostring(ParsedCommandLine[-2]),
        LocalFile= tostring(ParsedCommandLine[-1]),
        Direction = iff(ProcessCommandLine has "/Upload", 'Upload', 'Download')
    | project-reorder 
        TimeGenerated,
        DeviceId,
        DeviceName,
        Direction,
        RemoteUrl,
        LocalFile,
        InitiatingProcessFolderPath,
        InitiatingProcessAccountDomain,
        InitiatingProcessAccountName,
        InitiatingProcessSHA256,
        ProcessId,
        ProcessCommandLine
    | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
    | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  queryFrequency: PT1H
  queryPeriod: PT1H
  severity: Medium
  suppressionDuration: PT1H
  suppressionEnabled: false
  tactics:
    - Persistence
    - CommandAndControl
    - Exfiltration
  techniques:
    - T1197
    - T1105
    - T1048
  templateVersion: "1.0.0"
  triggerOperator: GreaterThan
  triggerThreshold: 0
type: Microsoft.SecurityInsights/alertRules
