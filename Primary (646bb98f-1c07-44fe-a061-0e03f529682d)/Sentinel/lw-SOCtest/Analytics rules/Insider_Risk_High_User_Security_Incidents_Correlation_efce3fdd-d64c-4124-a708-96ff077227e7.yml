# Primary (646bb98f-1c07-44fe-a061-0e03f529682d) · Sentinel · lw-SOCtest · Analytics rules
# Insider Risk_High User Security Incidents Correlation
# Eksporteret af SocHub. Historikken for filen (git log) er objektets versionshistorik.
id: "/subscriptions/f6033f31-9abe-488f-822e-41d46f45644e/resourceGroups/rg-soc/providers/Microsoft.OperationalInsights/workspaces/lw-SOCtest/providers/Microsoft.SecurityInsights/alertRules/efce3fdd-d64c-4124-a708-96ff077227e7"
kind: Scheduled
name: efce3fdd-d64c-4124-a708-96ff077227e7
properties:
  alertRuleTemplateName: "28a75d10-9b75-4192-9863-e452c3ad24db"
  description: "This alert joins SecurityAlerts to SecurityIncidents to associate Security Alerts and Incidents with user accounts. This aligns all Microsoft Alerting Products with Microsoft Incident Generating Products (Microsoft Sentinel, M365 Defender) for a count of user security incidents over time. The default threshold is 5 security incidents, and this is customizable per the organization's requirements. Results include UserPrincipalName (UPN), SecurityIncident, LastIncident, ProductName, LastObservedTime, and Previous Incidents. There is an option for configuration of correlations against Microsoft Sentinel watchlists. For more information, see [Investigate incidents with Microsoft Sentinel]( https://docs.microsoft.com/azure/sentinel/investigate-cases)."
  displayName: Insider Risk_High User Security Incidents Correlation
  enabled: true
  entityMappings:
    - entityType: Account
      fieldMappings:
        - columnName: UPN
          identifier: FullName
        - columnName: AccountName
          identifier: Name
        - columnName: AccountUPNSuffix
          identifier: UPNSuffix
  eventGroupingSettings:
    aggregationKind: SingleAlert
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: true
      groupByAlertDetails: []
      groupByCustomDetails: []
      groupByEntities:
        - Account
      lookbackDuration: P1D
      matchingMethod: Selected
      reopenClosedIncident: true
  query: |
    let PreviousIncidents =
    SecurityIncident
    | summarize hint.strategy = shuffle arg_max(LastModifiedTime, *) by IncidentNumber
    | mv-expand AlertIds
    | extend AlertId = tostring(AlertIds)
    | join kind= innerunique ( 
              SecurityAlert 
              )
              on $left.AlertId == $right.SystemAlertId
    | summarize hint.strategy = shuffle arg_max(TimeGenerated, *), NumberOfUpdates = count() by SystemAlertId
    | mv-expand todynamic(Entities)
    | where Entities["Type"] =~ "account"
    | extend Name = tostring(tolower(Entities["Name"])), NTDomain = tostring(Entities["NTDomain"]), UPNSuffix = tostring(Entities["UPNSuffix"]), AadUserId = tostring(Entities["AadUserId"]), AadTenantId = tostring(Entities["AadTenantId"]), 
              Sid = tostring(Entities["Sid"]), IsDomainJoined = tobool(Entities["IsDomainJoined"]), Host = tostring(Entities["Host"])
    | extend UPN = iff(Name != "" and UPNSuffix != "", strcat(Name, "@", UPNSuffix), "")
    | extend Href_ = tostring(parse_json(ExtendedLinks)[0].Href)
    | where UPN <> ""
    | summarize PreviousIncidents = make_set(IncidentNumber) by UPN;
    let LastTimeObserved =
    SecurityIncident
    | summarize hint.strategy = shuffle arg_max(LastModifiedTime, *) by IncidentNumber
    | mv-expand AlertIds
    | extend AlertId = tostring(AlertIds)
    | join kind= innerunique ( 
              SecurityAlert 
              )
              on $left.AlertId == $right.SystemAlertId
    | summarize hint.strategy = shuffle arg_max(TimeGenerated, *), NumberOfUpdates = count() by SystemAlertId
    | mv-expand todynamic(Entities)
    | where Entities["Type"] =~ "account"
    | extend Name = tostring(tolower(Entities["Name"])), NTDomain = tostring(Entities["NTDomain"]), UPNSuffix = tostring(Entities["UPNSuffix"]), AadUserId = tostring(Entities["AadUserId"]), AadTenantId = tostring(Entities["AadTenantId"]), 
              Sid = tostring(Entities["Sid"]), IsDomainJoined = tobool(Entities["IsDomainJoined"]), Host = tostring(Entities["Host"])
    | extend UPN = iff(Name != "" and UPNSuffix != "", strcat(Name, "@", UPNSuffix), "")
    | extend Href_ = tostring(parse_json(ExtendedLinks)[0].Href)
    | where UPN <> ""
    | summarize arg_max(TimeGenerated, IncidentName) by UPN;
      SecurityIncident
    | summarize hint.strategy = shuffle arg_max(LastModifiedTime, *) by IncidentNumber
    | mv-expand AlertIds
    | extend AlertId = tostring(AlertIds)
    | join kind= innerunique ( 
              SecurityAlert 
              )
              on $left.AlertId == $right.SystemAlertId
    | summarize hint.strategy = shuffle arg_max(TimeGenerated, *), NumberOfUpdates = count() by SystemAlertId
    | mv-expand todynamic(Entities)
    | where Entities["Type"] =~ "account"
    | extend Name = tostring(tolower(Entities["Name"])), NTDomain = tostring(Entities["NTDomain"]), UPNSuffix = tostring(Entities["UPNSuffix"]), AadUserId = tostring(Entities["AadUserId"]), AadTenantId = tostring(Entities["AadTenantId"]), 
              Sid = tostring(Entities["Sid"]), IsDomainJoined = tobool(Entities["IsDomainJoined"]), Host = tostring(Entities["Host"])
    | extend UPN = iff(Name != "" and UPNSuffix != "", strcat(Name, "@", UPNSuffix), "")
    | extend Href_ = tostring(parse_json(ExtendedLinks)[0].Href)
    | where UPN <> ""
    | summarize count() by UPN, IncidentName, IncidentNumber, IncidentUrl, Severity, ProductName
    | extend SecurityIncidents = count_
    | where SecurityIncidents > 5 //Adjust & Tune within Organzational Requirements
    | join (LastTimeObserved) on UPN
    | project-rename LastObserved = TimeGenerated, LastIncident = IncidentNumber
    | project-away IncidentName, count_, UPN1, IncidentName1, Severity, IncidentUrl
    | join kind=inner (PreviousIncidents) on UPN
    // | lookup kind=inner _GetWatchlist('<Your Watchlist Name>') on $left.UPN == $right.SearchKey
    | project UPN, SecurityIncidents, LastIncident, ProductName, LastObserved, PreviousIncidents
    | sort by SecurityIncidents desc
    | extend AccountName = tostring(split(UPN, "@")[0]), AccountUPNSuffix = tostring(split(UPN, "@")[1])
  queryFrequency: P7D
  queryPeriod: P7D
  severity: High
  suppressionDuration: PT1H
  suppressionEnabled: false
  tactics:
    - Execution
  techniques:
    - T1204
  templateVersion: "1.1.2"
  triggerOperator: GreaterThan
  triggerThreshold: 0
type: Microsoft.SecurityInsights/alertRules
