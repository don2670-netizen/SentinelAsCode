# Primary (646bb98f-1c07-44fe-a061-0e03f529682d) · Sentinel · lw-SOCtest · Analytics rules
# Sdelete deployed via GPO and run recursively
# Eksporteret af SocHub. Historikken for filen (git log) er objektets versionshistorik.
id: "/subscriptions/f6033f31-9abe-488f-822e-41d46f45644e/resourceGroups/rg-soc/providers/Microsoft.OperationalInsights/workspaces/lw-SOCtest/providers/Microsoft.SecurityInsights/alertRules/5e1c670d-5e7c-41fa-8e3c-6f21f1e2b8fc"
kind: Scheduled
name: "5e1c670d-5e7c-41fa-8e3c-6f21f1e2b8fc"
properties:
  alertRuleTemplateName: d9f28fdf-abc8-4f1a-a7e7-1aaec87a2fc5
  description: This query looks for the Sdelete process being run recursively after being deployed to a host via GPO. Attackers could use this technique to deploy Sdelete to multiple host and delete data on them.
  displayName: Sdelete deployed via GPO and run recursively
  enabled: true
  entityMappings:
    - entityType: Account
      fieldMappings:
        - columnName: TargetAccount
          identifier: FullName
        - columnName: AccountName
          identifier: Name
        - columnName: AccountNTDomain
          identifier: NTDomain
    - entityType: Host
      fieldMappings:
        - columnName: Computer
          identifier: FullName
        - columnName: HostName
          identifier: HostName
        - columnName: HostNameDomain
          identifier: DnsDomain
  eventGroupingSettings:
    aggregationKind: SingleAlert
  incidentConfiguration:
    createIncident: true
    groupingConfiguration:
      enabled: false
      groupByAlertDetails: []
      groupByCustomDetails: []
      groupByEntities: []
      lookbackDuration: PT5H
      matchingMethod: AllEntities
      reopenClosedIncident: false
  query: |
    SecurityEvent
      | where EventID == 4688
      | where Process =~ "svchost.exe"
      | where CommandLine has "-k GPSvcGroup" or CommandLine has "-s gpsvc"
      | extend timekey = bin(TimeGenerated, 1m)
      | project timekey, NewProcessId, Computer
      | join kind=inner (SecurityEvent
      | where EventID == 4688
      | where Process =~ "sdelete.exe" or CommandLine has "sdelete"
      | where ParentProcessName endswith "svchost.exe"
      | where CommandLine has_all ("-s", "-r")
      | extend newProcess = Process
      | extend timekey = bin(TimeGenerated, 1m)
      ) on $left.NewProcessId == $right.ProcessId, timekey, Computer
      | extend HostName = tostring(split(Computer, ".")[0]), DomainIndex = toint(indexof(Computer, '.'))
      | extend HostNameDomain = iff(DomainIndex != -1, substring(Computer, DomainIndex + 1), Computer)
      | extend AccountName = tostring(split(TargetAccount, @'\')[1]), AccountNTDomain = tostring(split(TargetAccount, @'\')[0])
  queryFrequency: P1D
  queryPeriod: P1D
  severity: Medium
  suppressionDuration: PT1H
  suppressionEnabled: false
  tactics:
    - Impact
  techniques:
    - T1485
  templateVersion: "1.0.2"
  triggerOperator: GreaterThan
  triggerThreshold: 0
type: Microsoft.SecurityInsights/alertRules
