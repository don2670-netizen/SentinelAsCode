id: "/subscriptions/f6033f31-9abe-488f-822e-41d46f45644e/resourceGroups/rg-soc/providers/Microsoft.OperationalInsights/workspaces/lw-SOCtest/providers/Microsoft.SecurityInsights/AutomationRules/459bce3b-1aaf-40f7-8f38-49fda0c015d4"
name: "459bce3b-1aaf-40f7-8f38-49fda0c015d4"
properties:
  actions:
    - actionConfiguration:
        description: |-
          <div>Dan dig et overblik over incidentet. Målet er at bekræfte om incidentet er en falsk eller sand positiv, og hvor stort omfang incidentet har på virksomhedens drift og stabilitet. Sigt efter at beskrive følgende områder.
          Beskriv løbende dine observationer og udførte handlinger via kommentarer i Sentinel.

          Undersøg og beskriv alt, der er relevant for håndteringen af incidentet.
          Hvornår blev det opdaget?
          Hvor længe har det stået på?
          Hvilke systemer, computere og konti er involveret?
          Hvilke filer eller handlinger har udløst alarmen?
          Hvilken type data er involveret og er det potentielt kompromitteret?
          Hvem/hvad er kilden til angrebet?
          Hvad var indgangsvektoren?

          Hvis det indsamlede data ikke tilskriver hændelsen at være en falsk positiv, fortsat da med containment.</div>
        title: Analysis
      actionType: AddIncidentTask
      order: 1
    - actionConfiguration:
        description: |-
          <div>Stop hændelsen fra at sprede sig yderligere i miljøet. Dette gælder både kortsigtet og langsigtet.
          Sigt så langt baglæns i angrebskæden som muligt - stop hellere et angreb fra overhovedet at nå ind på netværket, end at blokere det specifikt på enkelte endpoints.

          Begræns kilden til angrebet. Blokér eventuelle IP-adresser eller domæner.
          Vurdér impact hvis påvirkede systemer isoleres fra netværket eller slukkes helt. Kan det løse problemet på kort sigt uden at skabe unødvendig nedetid og tab af arbejdsmængde?

          Er der sårbarheder involveret, der kan fikses via ex. patches? (langsigtet løsning)
          Analyser evt. malware for spredning i miljøet. Begræns spredningskanalerne så vidt muligt.
          Kommunikér løbende til relevante stakeholders og involverede parter.</div>
        title: Containment
      actionType: AddIncidentTask
      order: 2
    - actionConfiguration:
        description: |-
          <div>Eliminer alle resterende årsager til incidentet.

          Slet alle rester af malware fra systemet. Sørg for at ondsindede filer er markeret til karantæne i Defender, så de ikke kan sprede sig yderligere i systemet.

          Gennemsøg logs for resterende artefakter fra malware på andre systemer.
          Implementer løsninger for sårbarheder der skyldes manglende- eller miskonfigurationer af systemer og software.</div>
        title: Eradication
      actionType: AddIncidentTask
      order: 3
    - actionConfiguration:
        description: |-
          <div>Genopret normal drift af påvirkede systemer.
          Vurder hvorvidt der er sikkert at alle spor af malwaren er slettet fra påvirkede systemer.
          Genbyg, reparer eller reinstaller endpointet til et funktionelt, sikkert stadie.
          Lås eventuelle kompromitterede bruger op, når deres konti er blevet resat (password, mfa, sessions, tokens)
          Sæt ekstra monitoring op for samme type angreb for en periode, hvis relevant.</div>
        title: Recovery
      actionType: AddIncidentTask
      order: 4
    - actionConfiguration:
        description: |-
          <div>Dokumenter hændelsen i relevant grad og find måder at stoppe det fra at ske i fremtiden.

          Brug kommentarer i Sentinel til at beskrive hvad, der er sket i incidentet, samt observationer og aktioner der er foretaget for at begrænse omfanget.

          Vurder hvorvidt og hvordan samme type incident kan stoppes fra at ske i fremtiden, enten ved tekniske implementationer eller organisatoriske politikker. Beskriv eventuelle løsningsforslag hertil, og få det sat i værk.

          Brug læringer fra incidentet til at opdatere og forbedre processer - herunder denne response plan.</div>
        title: Lessons Learned
      actionType: AddIncidentTask
      order: 5
