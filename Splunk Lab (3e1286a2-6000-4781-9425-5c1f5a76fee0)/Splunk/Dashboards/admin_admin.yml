# _admin
# Eksporteret af SOROC. Historikken for filen (git log) er objektets versionshistorik.
app: system
"eai:data": |-
  <view isVisible="false" >
    <label>Internal Admin Nav</label>
    <module name="Message" layoutPanel="messaging">
      <param name="filter">*</param>
      <param name="clearOnJobDispatch">False</param>
      <param name="maxSize">1</param>
    </module>
    <module name="AccountBar" layoutPanel="appHeader">
      <param name="mode">lite</param>
    </module>
    <module name="LiteBar" layoutPanel="liteHeader"></module>
  </view>
isDashboard: "true"
label: Internal Admin Nav
name: _admin
owner: nobody
