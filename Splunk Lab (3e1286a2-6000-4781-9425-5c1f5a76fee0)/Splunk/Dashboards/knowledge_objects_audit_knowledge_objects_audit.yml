      <definition><![CDATA[
  {
  	"dataSources": {
  		"ds_KtFg8oQ2": {
  			"type": "ds.chain",
  			"options": {
  				"extend": "ds_sxu2HJOI",
  				"query": "| search object_action = create | chart count by object_type",
