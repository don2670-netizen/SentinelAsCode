  			"type": "ds.chain",
  			"options": {
  				"extend": "ds_sxu2HJOI",
  				"query": " | timechart count "
  			},
  			"name": "Object Updates By Type - Pie chart search"
  		},
  		"ds_WY4obnmU": {
  			"type": "ds.chain",
  			"options": {
  				"extend": "ds_sxu2HJOI",
  				"query": "| stats count by user"
  			},
  			"name": "Activity By User - Table search"
  		},
  		"ds_OOnwhUDc": {
  			"type": "ds.chain",
  			"options": {
  				"extend": "ds_sxu2HJOI",
  				"query": "| stats count by appname"
  			},
  			"name": "Activity By App - Table search"
  		},
  		"ds_AXgjIFgY": {
  			"type": "ds.chain",
  			"options": {
  				"extend": "ds_sxu2HJOI",
  				"query": "| stats count by name"
  			},
  			"name": "Activity By Object - Table search"
  		},
  		"ds_sxu2HJOI": {
  			"type": "ds.search",
  			"options": {
  				"queryParameters": {
  					"earliest": "$time.earliest$",
  					"latest": "$time.latest$"
  				},
  				"query": "```Firstly filter out capability checks and non CRUD, non knowledge objects audit logs```\nindex=_audit  | where isnull(cap) AND NOT info IN (\"granted\", \"denied\") | search action IN (\"create_*\", \"update_*\", \"updated_*\", \"edit_*\", \"remove_*\", \"delete_*\", \"disable_*\", \"new_*\", \"move_*\", \"enable_*\") | search action IN (\"*_user\", \"*_saved_search\", \"*_data_model_file\", \"*_event_type\", \"*_tag\", \"*_fields_*\", \"*_lookup_table\", \"*_ui_view*\", \"*_ui_panel\", \"*_macro\", \"*_command\")\n```Extract object type and action```\n|  rex action=\"(?<object_action>[a-zA-Z]+)_(?<object_type>[a-zA-Z_]*),\"\n```Extract application name```\n| rex field=info \"app=\\\"(?<apptmp>.*)\\\"\" \n| eval appnametmp=IF(!isnull(apptmp),apptmp,IF(isnull(app),\"-missing-\",app) )\n| rex field=appnametmp \"'(?<apptmp2>.*)'\" \n| eval appname=IF(!isnull(apptmp2),apptmp2,appnametmp) \n```Unify object name```\n| eval name=IF(object_type=\"user\",username,name)  \n| eval name=IF(object_type=\"saved_search\",savedsearch_name,name)\n|  eval name=IF(!isnull(name),name,\"-missing-\")\n```Tags may have mnulti values: {[0]='tag_1' [1]='tag_2'}- split it to separate events```\n| eval tagnames=split(replace(name, \"\\[[0-9]*\\]=\",\"\"), \"' '\") |  mvexpand tagnames | eval name=ltrim(rtrim(tagnames,\"'}\"),\"{'\")\n```Extract host name from fqdn```\n| eval host=mvindex(split(host,\".\"),0)\n```Finally rename object type and actions to user friendly ones```\n| lookup object_types_normalization ORIG_OBJECT_TYPE AS object_type OUTPUT DEST_OBJECT_TYPE AS object_type\n| lookup action_types_normalization ORIG_ACTION AS object_action OUTPUT DEST_ACTION AS object_action\n```Preserve original event body```\n|  eval orig_body=_raw\n```Apply filtering in the base search to avoid 'unknown sid' issue```\n```| where \"$text_token$\"=\"-\" OR orig_body like \"%$text_token$%\"``` \n| search object_action IN ($ms_actions$)\n|  search object_type IN ($ms_object_types$)\n|  search name IN ($ms_object_names$)\n|  search user IN ($ms_user_names$)\n|  search appname IN ($ms_app_names$)\n|  search host IN ($ms_host_names$)\n|  search orig_body=$text_token|s$\n| stats count by _time, user, action, name, appname, host, info, object_type, object_action, orig_body"
  			},
  			"name": "ds_baseSelection"
  		},
  		"ds_nQAbGEMe": {
  			"type": "ds.chain",
  			"options": {
  				"extend": "ds_sxu2HJOI",
  				"query": "|  eval action=object_action \n|  eval app=IF(appname=\"-missing-\",\"-\",appname)\n|  eval type=object_type\n| sort -_time,\n|  eval event=orig_body\n|  eval time=strftime(_time,\"%Y-%m-%d  %H:%M:%S.%Q\")\n|  fields time, user, action, name, event\n|  fields - _time"
  			},
  			"name": "Activities"
  		},
