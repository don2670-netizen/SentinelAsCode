# Splunk Lab (3e1286a2-6000-4781-9425-5c1f5a76fee0) · Splunk · Detection rules
# SOROC Lab - SSH brute force
# Eksporteret af SOROC. Historikken for filen (git log) er objektets versionshistorik.
action.correlationsearch.annotations: "{\"mitre_attack\": [\"T1110\", \"T1110.001\"]}"
alert.digest_mode: "true"
alert.severity: "5"
alert.suppress: "true"
alert.suppress.period: "10m"
alert.track: "true"
alert_comparator: greater than
alert_threshold: "0"
alert_type: number of events
app: search
cron_schedule: "* * * * *"
description: Mindst 5 fejlede SSH-logins fra samme IP på 5 minutter
disabled: "0"
dispatch.earliest_time: "-5m"
dispatch.latest_time: now
is_scheduled: "true"
name: SOROC Lab - SSH brute force
owner: nobody
schedule_window: "0"
search: "index=soroc_lab sourcetype=linux_secure \"Failed password\" | stats count AS forsoeg values(user) AS brugere BY src_ip, host | where forsoeg >= 5"
