# Splunk Lab (3e1286a2-6000-4781-9425-5c1f5a76fee0) · Splunk · Saved searches
# Messages by minute last 3 hours
# Eksporteret af SOROC. Historikken for filen (git log) er objektets versionshistorik.
app: search
disabled: "false"
dispatch.earliest_time: "-3h"
is_scheduled: "false"
name: Messages by minute last 3 hours
owner: nobody
search: "index=_internal source=\"*metrics.log\" eps \"group=per_source_thruput\" NOT filetracker | eval events=eps*kb/kbps | timechart fixedrange=t span=1m limit=5 sum(events) by series"
